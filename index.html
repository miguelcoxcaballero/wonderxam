        const ExamEditor = ({ initialDocument, onDocumentChange, onBack, saveStatus }) => {
            const [blocks, setBlocks] = useState(() => initialDocument?.blocks || []);
            const [docStyle, setDocStyle] = useState(() => initialDocument?.docStyle || { font: FONTS[0].val, size: 100 });
            const [zoom, setZoom] = useState(1);
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [exporting, setExporting] = useState(false);
            const [title, setTitle] = useState(() => initialDocument?.title || DEFAULT_TITLE);
            const [overflowMap, setOverflowMap] = useState({});

            const containerRef = useRef(null);
            const onDocumentChangeRef = useRef(onDocumentChange);
            useEffect(() => {
                onDocumentChangeRef.current = onDocumentChange;
            }, [onDocumentChange]);

            useEffect(() => {
                onDocumentChangeRef.current?.({ title, blocks, docStyle });
            }, [title, blocks, docStyle]);
            
            const [drag, setDrag] = useState({ 
                active: false, 
                id: null, 
                mode: null, 
                startX: 0, 
                startY: 0, 
                origX: 0, 
                origY: 0, 
                origW: 0, 
                origH: 0,
                resizeW: 0,
                resizeH: 0,
                snapX: 0,
                snapY: 0,
                deltaX: 0, 
                deltaY: 0,
                isValid: true,
                collidingIds: [] 
            });

            const getMaxHeight = useCallback((b) => {
                return 1000; 
            }, []);

            useLayoutEffect(() => {
                const fit = () => {
                    if(!containerRef.current) return;
                    const w = containerRef.current.clientWidth;
                    const horizontalPadding = 40; 
                    const fullPageWidth = A4_W + horizontalPadding;

                    if (w < fullPageWidth) {
                        const rawScale = (w - horizontalPadding) / A4_W;
                        const safeScale = Math.max(0.1, rawScale * 0.97); 
                        setZoom(safeScale);
                    } else {
                        setZoom(1);
                    }
                };
                window.addEventListener('resize', fit);
                fit();
                return () => window.removeEventListener('resize', fit);
            }, []);

            const totalPages = useMemo(() => {
                let maxY = 0;
                blocks.forEach(b => { if(b.y + b.h > maxY) maxY = b.y + b.h; });
                return Math.max(1, Math.ceil(maxY / ROWS));
            }, [blocks]);

            const getPage = (y) => Math.floor(y / ROWS);

            const blocksByPage = useMemo(
                () => Array.from({length: totalPages}, (_, i) => blocks.filter(b => isBlockOnPage(b, i))),
                [blocks, totalPages]
            );

            const handleContentOverflow = useCallback((id, isOverflowing) => {
                setOverflowMap(prev => {
                    if (prev[id] === isOverflowing) return prev;
                    return { ...prev, [id]: isOverflowing };
                });
            }, []);

            const handleAutoResize = (id, newH) => {
                const clampedH = Math.min(newH, ROWS);
                
                setBlocks(prev => {
                    const idx = prev.findIndex(b => b.id === id);
                    if(idx === -1) return prev;
                    
                    const b = prev[idx];
                    if(b.h === clampedH) return prev;

                    const newBlocks = prev.map(cloneBlock);
                    const block = newBlocks[idx];
                    block.h = clampedH;
                    
                    const currentRow = block.y;
                    const pageIndex = Math.floor(currentRow / ROWS);
                    const pageStart = pageIndex * ROWS;
                    const pageEnd = (pageIndex + 1) * ROWS;
                    
                    if (currentRow + clampedH > pageEnd) {
                        if (currentRow !== pageStart) {
                             block.y = (pageIndex + 1) * ROWS;
                        }
                    }

                    const pushDown = (pusherId) => {
                        const pusher = newBlocks.find(x => x.id === pusherId);
                        
                        newBlocks.forEach(victim => {
                            if (victim.id === pusher.id) return;
                            const isHorizOverlapping = victim.x < pusher.x + pusher.w && victim.x + victim.w > pusher.x;
                            if (isHorizOverlapping) {
                                if (victim.y < pusher.y + pusher.h && victim.y + victim.h > pusher.y) {
                                    const neededY = pusher.y + pusher.h;
                                    const diff = neededY - victim.y;
                                    if (diff > 0) {
                                        victim.y += diff;
                                        const vPageIndex = Math.floor(victim.y / ROWS);
                                        const vPageEnd = (vPageIndex + 1) * ROWS;
                                        if (victim.y + victim.h > vPageEnd) {
                                            const vPageStart = vPageIndex * ROWS;
                                            if (victim.y !== vPageStart) {
                                                victim.y = (vPageIndex + 1) * ROWS;
                                            }
                                        }
                                        pushDown(victim.id);
                                    }
                                }
                            }
                        });
                    };

                    pushDown(block.id);
                    return newBlocks;
                });
            };

            const add = (type) => {
                setSidebarOpen(false);
                setBlocks(prev => {
                    let w=4, h=2, data={};
                    const qNum = prev.filter(b=>QUESTION_TYPES.includes(b.type)).length + 1;

                    if(type==='header'){w=18;h=5; data={inst:'', title:'', logo:null};}
                    else if(type==='text'){w=18;h=1; data={text:''};} 
                    else if(type==='line'){w=18;h=1; data={};}
                    else if(type==='image'){w=6;h=6; data={src:null};}
                    else if(type==='mcq'){w=18;h=1; data={num:qNum+'.', q:'', opts:['']};} 
                    else if(type==='short'){w=18;h=2; data={num:qNum+'.', q:''};} 
                    else if(type==='tf'){w=18;h=1; data={num:qNum+'.', q:''};} 

                    let y = 0;
                    while(y < ROWS*10) {
                        if (getPage(y) !== getPage(y + h - 1)) {
                            y = (getPage(y) + 1) * ROWS;
                            continue;
                        }
                        for(let x=0; x<=COLS-w; x++) {
                            const candidate = { x, y, w, h };
                            const hit = prev.some(b => blocksOverlap(candidate, b));
                            if(!hit) {
                                return [...prev, { id: Date.now() + Math.random(), type, x, y, w, h, data }];
                            }
                        }
                        y++;
                    }
                    return prev;
                });
            };

            const updateBlock = useCallback((id, partial) => setBlocks(prev => prev.map(b => b.id===id ? {...b, ...partial} : b)), []);
            const removeBlock = useCallback((id) => {
                setBlocks(prev => prev.filter(b => b.id!==id));
                setOverflowMap(prev => {
                    if (!(id in prev)) return prev;
                    const next = {...prev};
                    delete next[id];
                    return next;
                });
            }, []);

            const getPointerPos = (e) => {
                if(e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
                return { x: e.clientX, y: e.clientY };
            };

            const startDrag = (e, id, mode) => {
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();

                const pos = getPointerPos(e);
                const b = blocks.find(x=>x.id===id);
                if (!b) return;
                setDrag({ 
                    active: true, 
                    id, 
                    mode, 
                    startX: pos.x, 
                    startY: pos.y, 
                    origX: b.x, 
                    origY: b.y, 
                    origW: b.w, 
                    origH: b.h,
                    resizeW: b.w,
                    resizeH: b.h,
                    snapX: b.x, 
                    snapY: b.y, 
                    deltaX: 0, 
                    deltaY: 0,
                    isValid: true,
                    collidingIds: [] 
                });
            };

            useEffect(() => {
                const move = (e) => {
                    if(!drag.active) return;
                    if (e.cancelable) e.preventDefault();
                    
                    const pos = getPointerPos(e);
                    
                    const dX = pos.x - drag.startX;
                    const dY = pos.y - drag.startY;
                    const gridDx = Math.round(dX / (CELL * zoom));
                    const gridDy = Math.round(dY / (CELL * zoom));

                    let valid = true;
                    const collisions = [];
                    const otherBlocks = blocks.filter(b => b.id !== drag.id);

                    if(drag.mode === 'move') {
                        let nx = Math.max(0, Math.min(COLS - drag.origW, drag.origX + gridDx));
                        let ny = Math.max(0, drag.origY + gridDy); 
                        
                        const startPage = Math.floor(ny / ROWS);
                        const endPage = Math.floor((ny + drag.origH - 1) / ROWS);
                        if(startPage !== endPage) {
                            const nextPageStart = endPage * ROWS;
                            const prevPageEnd = nextPageStart - drag.origH;
                            if(Math.abs(ny - nextPageStart) < Math.abs(ny - prevPageEnd)) ny = nextPageStart;
                            else ny = prevPageEnd;
                        }

                        const candidate = { x: nx, y: ny, w: drag.origW, h: drag.origH };
                        for(let ob of otherBlocks) {
                            if(blocksOverlap(candidate, ob)) { 
                                valid = false; 
                                collisions.push(ob.id);
                            }
                        }

                        setDrag(prev => ({
                            ...prev, 
                            deltaX: dX, 
                            deltaY: dY,
                            snapX: nx,
                            snapY: ny,
                            isValid: valid,
                            collidingIds: collisions
                        }));

                    } else {
                        const b = blocks.find(x => x.id === drag.id);
                        if (!b) return;
                        
                        const minSize = getBlockMinSize(b.type);

                        let nw = Math.max(1, Math.min(COLS - drag.origX, drag.origW + gridDx));
                        let nh = Math.max(1, drag.origH + gridDy);
                        
                        if(b.type === 'line') nh = 1;

                        const p = Math.floor(drag.origY / ROWS);
                        const maxH = ((p+1)*ROWS) - drag.origY;
                        nh = Math.min(nh, maxH, ROWS);

                        const candidate = { x: drag.origX, y: drag.origY, w: nw, h: nh };
                        for(let ob of otherBlocks) {
                            if(blocksOverlap(candidate, ob)) { 
                                valid = false; 
                                collisions.push(ob.id);
                            }
                        }

                        if (nw < minSize.w || nh < minSize.h) {
                            valid = false;
                        }

                        setDrag(prev => ({
                            ...prev,
                            resizeW: nw,
                            resizeH: nh,
                            isValid: valid,
                            collidingIds: collisions
                        }));
                    }
                };
                
                const up = () => {
                    if(drag.active) {
                        if (drag.mode === 'move') {
                            if(drag.isValid) {
                                updateBlock(drag.id, {x: drag.snapX, y: drag.snapY});
                            }
                        } else {
                            const b = blocks.find(x => x.id === drag.id);
                            if (b) {
                                const minSize = getBlockMinSize(b.type);

                                const finalW = Math.max(drag.resizeW, minSize.w);
                                const finalH = Math.max(drag.resizeH, minSize.h);

                                const otherBlocks = blocks.filter(x => x.id !== drag.id);
                                const candidate = { x: b.x, y: b.y, w: finalW, h: finalH };
                                const hasCollision = otherBlocks.some(ob => blocksOverlap(candidate, ob));

                                if (!hasCollision) {
                                    updateBlock(drag.id, {w: finalW, h: finalH});
                                }
                            }
                        }
                    }
                    setDrag(prev => ({...prev, active:false, collidingIds: []}));
                };

                if(drag.active) {
                    window.addEventListener('mousemove', move);
                    window.addEventListener('mouseup', up);
                    window.addEventListener('touchmove', move, { passive: false });
                    window.addEventListener('touchend', up);
                }
                return () => { 
                    window.removeEventListener('mousemove', move); 
                    window.removeEventListener('mouseup', up);
                    window.removeEventListener('touchmove', move);
                    window.removeEventListener('touchend', up);
                }
            }, [drag, blocks, zoom, updateBlock]);

            const doExport = async () => {
                setExporting(true);
                setSidebarOpen(false);
                const oldZoom = zoom;
                setZoom(1);
                await new Promise(r => setTimeout(r, 500)); 

                const pdf = new window.jspdf.jsPDF('p', 'mm', 'a4');
                const pages = document.querySelectorAll('.a4-page');
                
                for(let i=0; i<pages.length; i++) {
                    const cvs = await html2canvas(pages[i], { 
                        scale: 4, 
                        useCORS: true, 
                        backgroundColor:'#ffffff',
                        logging: false
                    });
                    
                    if(i>0) pdf.addPage();
                    pdf.addImage(cvs.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
                }
                pdf.save(title + '.pdf');
                setZoom(oldZoom);
                setExporting(false);
            };

            return (
                <div className={`app-shell ${exporting?'exporting':''}`}>
                    <div className="main-area">
                        <div className="top-bar">
                            <button className="drive-btn drive-btn-secondary drive-icon-btn mr-3 no-export" onClick={onBack} title="Drive home" aria-label="Drive home">
                                <MatIcon name="folder" />
                            </button>
                            <input className="doc-title" value={title} onChange={e=>setTitle(e.target.value)} />
                            <SaveStatus status={saveStatus} />
                        </div>
                        
                        <div className="viewport" ref={containerRef}>
                            <div className="zoom-outer-container" style={{ minHeight: (A4_H + PAGE_GAP) * totalPages * zoom }}>
                                <div className="pages-scale-wrapper" style={{ transform: `scale(${zoom})`, fontFamily: docStyle.font, fontSize: (16 * (docStyle.size / 100)) + 'px' }}>
                                    {Array.from({length: totalPages}).map((_, i) => (
                                        <div key={i} className="a4-page" style={{padding: `${MARGIN_Y}px ${MARGIN_X}px`}}>
                                            <div className="relative w-full h-full">
                                                <GridLayer blocks={blocks} pageIndex={i} draggingBlockId={drag.active ? drag.id : null} />

                                                {drag.active && drag.mode === 'move' && (() => {
                                                    const start = drag.snapY; const end = drag.snapY + drag.origH;
                                                    const pageStart = i*ROWS; const pageEnd = (i+1)*ROWS;
                                                    if(start < pageEnd && end > pageStart) {
                                                        return (
                                                            <div className={`snap-ghost ${!drag.isValid ? 'invalid' : ''}`} style={{
                                                                left: drag.snapX*CELL, top: (drag.snapY - i*ROWS)*CELL,
                                                                width: drag.origW*CELL, height: drag.origH*CELL
                                                            }}/>
                                                        );
                                                    }
                                                })()}

                                                {blocksByPage[i].map(b => {
                                                    const isActive = drag.active && drag.id === b.id;
                                                    const isColliding = drag.active && drag.collidingIds.includes(b.id);
                                                    const isOverflow = overflowMap[b.id] && isActive;
                                                    const isInvalid = isActive && (!drag.isValid || isOverflow);
                                                    let displayX = b.x, displayY = b.y, displayW = b.w, displayH = b.h, styleOverride = {};

                                                    if (isActive) {
                                                        if (drag.mode === 'move') {
                                                            const startPixelY = (drag.origY - (i * ROWS)) * CELL; 
                                                            const startPixelX = drag.origX * CELL;
                                                            
                                                            styleOverride = {
                                                                left: startPixelX + (drag.deltaX / zoom),
                                                                top: startPixelY + (drag.deltaY / zoom),
                                                                zIndex: 999, 
                                                                transition: 'none',
                                                                opacity: 0.9 
                                                            };
                                                        } else if (drag.mode === 'resize') {
                                                            displayW = drag.resizeW; displayH = drag.resizeH;
                                                            styleOverride = { zIndex: 999, transition: 'none' }
                                                        }
                                                    }

                                                    const contentBlockProps = isActive && drag.mode === 'resize' ? { ...b, w: drag.resizeW, h: drag.resizeH } : b;
                                                    const maxAvailableH = getMaxHeight(b);

                                                    return (
                                                        <div 
                                                            key={b.id} 
                                                            className={`block-wrapper ${b.type === 'image' ? 'type-image' : ''} ${isActive ? 'dragging' : ''} ${isInvalid ? 'invalid' : ''} ${isColliding ? 'collision-highlight' : ''} ${drag.active && !isActive && !isColliding ? 'scale-[0.98] opacity-90' : ''}`}
                                                            style={{
                                                                left: displayX * CELL,
                                                                top: (displayY - i*ROWS) * CELL,
                                                                width: displayW * CELL,
                                                                height: displayH * CELL,
                                                                ...styleOverride 
                                                            }}
                                                        >
                                                            <div className="block-scale-content">
                                                                <div className="drag-handle" onMouseDown={e=>startDrag(e, b.id, 'move')} onTouchStart={e=>startDrag(e, b.id, 'move')}>
                                                                    <MatIcon name="drag_indicator"/>
                                                                </div>
                                                                <div className="delete-btn" onClick={()=>removeBlock(b.id)}>
                                                                    <MatIcon name="delete"/>
                                                                </div>
                                                                <BlockContent b={contentBlockProps} update={updateBlock} fontSizeMultiplier={docStyle.size} handleAutoResize={handleAutoResize} isResizing={isActive && drag.mode === 'resize'} setContentOverflow={handleContentOverflow} maxAvailableH={maxAvailableH} />
                                                                <div className={`resize-handle ${b.type==='line'?'resize-handle-h':''}`} onMouseDown={e=>startDrag(e, b.id, 'resize')} onTouchStart={e=>startDrag(e, b.id, 'resize')}></div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                            <div className="absolute bottom-8 w-full left-0 text-center text-base font-medium text-black">{i+1} / {totalPages}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    <button className="fab" onClick={()=>setSidebarOpen(!sidebarOpen)}>
                        <MatIcon name={sidebarOpen ? "close" : "add"} />
                    </button>

                    <div className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
                        <div className="flex items-center gap-2 font-normal text-xl px-2 mb-2">
                            <MatIcon name="school" className="text-purple-700"/>
                            <span className="text-black">Wonderxam</span>
                        </div>
                        <button className="btn-primary" onClick={doExport} disabled={exporting}>
                            <MatIcon name="download"/> {exporting ? 'Exporting...' : 'Download PDF'}
                        </button>

                        <div className="overflow-y-auto flex-1 flex flex-col gap-4 pr-1">
                            <div className="bg-gray-50 p-3 rounded-xl border border-gray-200">
                                <div className="text-xs font-bold text-gray-500 uppercase mb-3">Document Style</div>
                                
                                <CustomSelect 
                                    label="Font Family"
                                    value={docStyle.font}
                                    options={FONTS}
                                    onChange={v => setDocStyle({...docStyle, font: v})}
                                />

                                <CustomSelect 
                                    label="Font Size"
                                    value={docStyle.size}
                                    options={FONT_SIZES}
                                    onChange={v => setDocStyle({...docStyle, size: Number(v)})}
                                />
                            </div>

                            <div>
                                <div className="text-xs font-bold text-gray-500 uppercase mb-2">Structure</div>
                                <button className="tool-btn" onClick={()=>add('header')}><MatIcon name="title"/> Header</button>
                                <button className="tool-btn" onClick={()=>add('text')}><MatIcon name="notes"/> Text Block</button>
                                <button className="tool-btn" onClick={()=>add('line')}><MatIcon name="remove"/> Divider Line</button>
                                <button className="tool-btn" onClick={()=>add('image')}><MatIcon name="image"/> Image</button>
                            </div>

                            <div>
                                <div className="text-xs font-bold text-gray-500 uppercase mb-2">Questions</div>
                                <button className="tool-btn" onClick={()=>add('mcq')}><MatIcon name="list"/> Multiple Choice</button>
                                <button className="tool-btn" onClick={()=>add('short')}><MatIcon name="short_text"/> Short Answer</button>
                                <button className="tool-btn" onClick={()=>add('tf')}><MatIcon name="check_circle"/> True / False</button>
                            </div>
                        </div>
                        
                        <div className="mt-auto pt-4 border-t border-gray-200 flex items-center justify-center gap-2 opacity-80">
                            <svg className="h-4 w-6 text-brand-copper" viewBox="0 0 100 60" fill="none" stroke="currentColor" strokeWidth="4">
                                <path d="M5 55 L50 10 L95 55" strokeLinecap="round" strokeLinejoin="round"/>
                            </svg>
                            <span className="font-logo text-xs text-gray-500 tracking-tight lowercase">inhouse software</span>
                        </div>
                    </div>
                </div>
            );
        };

        const DriveLogo = ({ name = "Wonderxam" }) => (
            <div className="drive-brand">
                <MatIcon name="school" />
                <span className="brand-name">{name}</span>
            </div>
        );

        const ProfileMenu = ({ profile, onRefresh, onSignOut }) => {
            const [open, setOpen] = useState(false);
            return (
                <div className="drive-profile">
                    <button className="drive-profile-btn" type="button" aria-label="Account menu" aria-haspopup="menu" aria-expanded={open} onClick={() => setOpen(v => !v)}>
                        <img className="drive-profile-avatar" src={profile?.photo || DEFAULT_AVATAR} alt="Profile" />
                    </button>
                    {open && (
                        <div className="drive-profile-menu" role="menu">
                            <div className="drive-profile-meta">
                                <img className="drive-profile-avatar" src={profile?.photo || DEFAULT_AVATAR} alt="Profile" />
                                <div>
                                    <div className="drive-profile-name">{profile?.name || 'Signed in'}</div>
                                    <div className="drive-profile-email">{profile?.email || ''}</div>
                                </div>
                            </div>
                            <div className="drive-profile-actions">
                                <button className="drive-btn drive-btn-secondary" type="button" onClick={() => { setOpen(false); onRefresh(); }}>Refresh</button>
                                <button className="drive-btn drive-btn-secondary" type="button" onClick={onSignOut}>Sign out</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const DriveCard = ({ file, onOpen }) => (
            <button className="drive-card" type="button" onClick={() => onOpen(file)}>
                <div className="drive-card-preview">
                    <MatIcon name="description" className="text-[42px]" />
                </div>
                <div>
                    <div className="drive-card-title">{stripWonderxamExtension(file.name)}</div>
                    <div className="drive-card-meta">{formatDriveDate(file.modifiedTime) || 'Wonderxam exam'}</div>
                </div>
            </button>
        );

        const FolderCard = ({ folder, onOpen }) => (
            <button className="drive-card folder" type="button" onClick={() => onOpen(folder)}>
                <div className="drive-card-preview">
                    <MatIcon name="folder" className="text-[46px]" />
                </div>
                <div>
                    <div className="drive-card-title">{folder.name || 'Folder'}</div>
                    <div className="drive-card-meta">{formatDriveDate(folder.modifiedTime) || 'Folder'}</div>
                </div>
            </button>
        );

        const WelcomeScreen = ({ ready, status, onSignIn }) => (
            <div id="welcome-view">
                <div className="welcome-logo">
                    <MatIcon name="school" />
                    <span className="brand-name">Wonderxam</span>
                </div>
                <button className="drive-btn drive-btn-primary" type="button" disabled={!ready} onClick={onSignIn}>
                    {ready ? 'Sign in with Google' : 'Loading Google...'}
                </button>
                <div className="drive-status text-center">{status}</div>
            </div>
        );

        const DriveHome = ({ drive, onCreate, onOpen }) => {
            const [showModal, setShowModal] = useState(false);
            const [modalMode, setModalMode] = useState('exam');
            const [examName, setExamName] = useState('');
            const [search, setSearch] = useState('');
            const [fabOpen, setFabOpen] = useState(false);

            const handleCreate = () => {
                const name = examName.trim();
                if (modalMode === 'folder') {
                    drive.createFolder(name || 'New Folder', search);
                } else {
                    onCreate(name || DEFAULT_TITLE);
                }
                setShowModal(false);
                setExamName('');
            };

            const filteredFiles = useMemo(() => {
                const term = search.trim().toLowerCase();
                if (!term) return drive.files;
                return drive.files.filter(file => stripWonderxamExtension(file.name).toLowerCase().includes(term));
            }, [drive.files, search]);

            const recentFiles = filteredFiles.slice(0, 8);
            const openCreateModal = (mode) => {
                setModalMode(mode);
                setExamName('');
                setShowModal(true);
                setFabOpen(false);
            };

            return (
                <div id="drive-home">
                    <div className="drive-topbar">
                        <DriveLogo />
                        <div className="drive-actions">
                            <ProfileMenu profile={drive.profile} onRefresh={() => drive.refreshFiles(search)} onSignOut={drive.signOut} />
                        </div>
                    </div>

                    <div className="drive-main">
                        <div className="drive-toolbar">
                            <button className="drive-btn drive-btn-secondary drive-icon-btn" type="button" title="Refresh" aria-label="Refresh" onClick={() => drive.refreshFiles(search)}>
                                <MatIcon name="refresh" />
                            </button>
                            <input
                                className="drive-search"
                                type="text"
                                placeholder="Search exams..."
                                value={search}
                                onChange={(e) => setSearch(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && drive.refreshFiles(search)}
                            />
                            <div className="drive-status">{drive.status}</div>
                        </div>

                        {drive.folderStack.length > 0 && (
                            <div className="drive-breadcrumbs">
                                {drive.folderStack.map((folder, index) => (
                                    <React.Fragment key={folder.id}>
                                        {index > 0 && <span>/</span>}
                                        <button className="drive-breadcrumb" type="button" onClick={() => drive.navigateFolder(index, search)}>
                                            {folder.name}
                                        </button>
                                    </React.Fragment>
                                ))}
                            </div>
                        )}

                        <section className="drive-section">
                            <div className="drive-section-header">
                                <div className="drive-section-title">Recents</div>
                            </div>
                            {recentFiles.length ? (
                                <div className="drive-recents">
                                    {recentFiles.map(file => <DriveCard key={file.id} file={file} onOpen={onOpen} />)}
                                </div>
                            ) : (
                                <div className="drive-empty">{drive.loading ? 'Loading exams...' : 'No recent exams yet.'}</div>
                            )}
                        </section>

                        <section className="drive-section">
                            <div className="drive-section-header">
                                <div className="drive-section-title">My Drive</div>
                            </div>
                            {(drive.folders.length || filteredFiles.length) ? (
                                <div className="drive-file-grid">
                                    {drive.folders.map(folder => <FolderCard key={folder.id} folder={folder} onOpen={(folder) => drive.enterFolder(folder, search)} />)}
                                    {filteredFiles.map(file => <DriveCard key={file.id} file={file} onOpen={onOpen} />)}
                                </div>
                            ) : (
                                <div className="drive-empty">{drive.loading ? 'Loading items...' : 'No folders or Wonderxam exams found here.'}</div>
                            )}
                        </section>
                    </div>

                    <div className="drive-fab-wrap">
                        {fabOpen && (
                            <div className="drive-fab-menu">
                                <button type="button" onClick={() => openCreateModal('exam')}>
                                    <MatIcon name="description" />
                                    <span>Exam</span>
                                </button>
                                <button type="button" onClick={() => openCreateModal('folder')}>
                                    <MatIcon name="create_new_folder" />
                                    <span>Folder</span>
                                </button>
                            </div>
                        )}
                        <button className="drive-fab" type="button" aria-label="Create" aria-expanded={fabOpen} onClick={() => setFabOpen(v => !v)}>
                            <MatIcon name={fabOpen ? 'close' : 'add'} />
                        </button>
                    </div>

                    {showModal && (
                        <div className="modal-overlay">
                            <div className="modal-card">
                                <h2 className="modal-title">{modalMode === 'folder' ? 'New Folder' : 'New Exam'}</h2>
                                <div className="input-group">
                                    <input 
                                        type="text" 
                                        className="mat-input" 
                                        placeholder={modalMode === 'folder' ? 'New Folder' : 'Untitled Exam'} 
                                        autoFocus
                                        value={examName}
                                        onChange={(e) => setExamName(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && handleCreate()}
                                    />
                                    <span className="input-label">{modalMode === 'folder' ? 'Folder Name' : 'Exam Name'}</span>
                                </div>
                                <div className="modal-actions">
                                    <button className="btn-text" onClick={() => setShowModal(false)}>Cancel</button>
                                    <button className="btn-fill" onClick={handleCreate}>Create</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            const drive = useGoogleDrive();
            const [view, setView] = useState('home');
            const [currentDocument, setCurrentDocument] = useState(() => buildExamDocument());
            const [saveStatus, setSaveStatus] = useState('');
            const [documentKey, setDocumentKey] = useState(0);
            const saveTimerRef = useRef(null);
            const latestDocumentRef = useRef(currentDocument);
            const savingRef = useRef(false);

            useEffect(() => {
                latestDocumentRef.current = currentDocument;
            }, [currentDocument]);

            const persistCurrentDocument = useCallback(async () => {
                if (!drive.signedIn) return;
                if (savingRef.current) {
                    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
                    saveTimerRef.current = setTimeout(() => persistCurrentDocument(), 1000);
                    return;
                }
                savingRef.current = true;
                setSaveStatus('Saving to Drive...');
                try {
                    const saved = await drive.saveExam(latestDocumentRef.current);
                    setCurrentDocument(prev => ({
                        ...prev,
                        driveFileId: saved.driveFileId,
                        driveFileName: saved.driveFileName,
                        modifiedTime: saved.modifiedTime
                    }));
                    setSaveStatus('Saved to Drive');
                } catch (err) {
                    console.error(err);
                    setSaveStatus('Drive save failed');
                } finally {
                    savingRef.current = false;
                }
            }, [drive]);

            const scheduleDriveSave = useCallback(() => {
                if (!drive.signedIn || view !== 'editor') return;
                if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
                setSaveStatus('Unsaved changes');
                saveTimerRef.current = setTimeout(() => {
                    persistCurrentDocument();
                }, 900);
            }, [drive.signedIn, persistCurrentDocument, view]);

            const handleDocumentChange = useCallback((partial) => {
                setCurrentDocument(prev => {
                    const next = { ...prev, ...partial };
                    latestDocumentRef.current = next;
                    return next;
                });
                scheduleDriveSave();
            }, [scheduleDriveSave]);

            const createExam = useCallback((name) => {
                if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
                const next = { ...buildExamDocument(name), driveFolderId: drive.currentFolderId || null };
                setCurrentDocument(next);
                latestDocumentRef.current = next;
                setSaveStatus('Unsaved changes');
                setDocumentKey(k => k + 1);
                setView('editor');
            }, [drive.currentFolderId]);

            const openExam = useCallback(async (file) => {
                try {
                    const doc = await drive.openExam(file);
                    if (!doc) return;
                    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
                    setCurrentDocument(doc);
                    latestDocumentRef.current = doc;
                    setSaveStatus('Saved to Drive');
                    setDocumentKey(k => k + 1);
                    setView('editor');
                } catch (err) {
                    console.error(err);
                    setSaveStatus('Unable to open exam');
                }
            }, [drive]);

            const goHome = useCallback(() => {
                if (saveTimerRef.current) {
                    clearTimeout(saveTimerRef.current);
                    saveTimerRef.current = null;
                    persistCurrentDocument();
                }
                drive.refreshFiles();
                setView('home');
            }, [drive, persistCurrentDocument]);

            if (!drive.signedIn) {
                return <WelcomeScreen ready={drive.ready} status={drive.status} onSignIn={drive.signIn} />;
            }

            if (view === 'home') {
                return <DriveHome drive={drive} onCreate={createExam} onOpen={openExam} />;
            }

            return (
                <ExamEditor
                    key={documentKey}
                    initialDocument={currentDocument}
                    onDocumentChange={handleDocumentChange}
                    onBack={goHome}
                    saveStatus={saveStatus}
                />
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
